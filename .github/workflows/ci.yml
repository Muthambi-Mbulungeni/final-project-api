name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StrategiesMigrationPlatform.slnx

      - name: Build
        run: dotnet build StrategiesMigrationPlatform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test StrategiesMigrationPlatform.slnx --configuration Release --no-build --verbosity normal
