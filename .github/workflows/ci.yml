name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore StrategiesMigrationPlatform.slnx

      - name: Build
        run: dotnet build StrategiesMigrationPlatform.slnx --configuration Release --no-restore

      - name: Test
        env:
          Jwt__Key: ${{ secrets.JWT_KEY_CI }}
        run: >
          dotnet test StrategiesMigrationPlatform.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./test-results/*.trx

  frontend:
    name: React Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: strategies-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: strategies-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
