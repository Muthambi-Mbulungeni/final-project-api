px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Registered, unconfirmed<br />IsActive = true<br />EmailConfirmed = false<br />(cannot sign in)</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="my-svg-state-Active-6" data-look="classic" transform="translate(653.484375, 414)"><rect class="basic label-container" style="" rx="5" ry="5" x="-87.8125" y="-56" width="175.625" height="112"/><g class="label" style="" transform="translate(-79.8125, -48)"><rect/><foreignObject width="159.625" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Active<br />IsActive = true<br />EmailConfirmed = true<br />(can sign in)</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="my-svg-state-Inactive-7" data-look="classic" transform="translate(964.28125, 370)"><rect class="basic label-container" style="" rx="5" ry="5" x="-99.15625" y="-44" width="198.3125" height="88"/><g class="label" style="" transform="translate(-91.15625, -36)"><rect/><foreignObject width="182.3125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel markdown-node-label"><p>Inactive<br />IsActive = false<br />(cannot sign in or refresh)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-state-root_start-1" data-look="classic" transform="translate(15, 414)"><circle class="state-start" r="7" width="14" height="14"/></g><g class="node statediagram-note" id="my-svg-state-Inactive----note-7" data-look="classic" transform="translate(1371.7734375, 370)"><g class="basic label-container outer-path"><path d="M-124.8359375 -327 L124.8359375 -327 L124.8359375 327 L-124.8359375 327" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-124.8359375 -327 C-57.57654640629448 -327, 9.682844687411034 -327, 124.8359375 -327 M-124.8359375 -327 C-41.67165242505247 -327, 41.49263264989506 -327, 124.8359375 -327 M124.8359375 -327 C124.8359375 -97.29668543617524, 124.8359375 132.40662912764952, 124.8359375 327 M124.8359375 -327 C124.8359375 -113.66661963608601, 124.8359375 99.66676072782798, 124.8359375 327 M124.8359375 327 C60.799789080362956 327, -3.236359339274088 327, -124.8359375 327 M124.8359375 327 C40.81032622396111 327, -43.215285052077775 327, -124.8359375 327 M-124.8359375 327 C-124.8359375 150.11382079887332, -124.8359375 -26.77235840225336, -124.8359375 -327 M-124.8359375 327 C-124.8359375 184.2100161237951, -124.8359375 41.4200322475902, -124.8359375 -327" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-109.8359375, -312)"><rect/><foreignObject width="219.671875" height="624"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>register = POST /api/auth/register (role Client)<br />suspend = PATCH /api/admin/users/{id}/suspend, audit "Suspended user"<br />soft delete = DELETE /api/admin/users/{id}, audit "Deactivated user"<br />reinstate = PATCH /api/admin/users/{id}/reinstate, audit "Reinstated user"<br />reset password = POST /api/auth/reset-password (new hash, refresh tokens revoked)</p>        Suspended and soft-deleted are the SAME stored state (IsActive = false),
        so reinstate also undoes a delete. Repeating suspend, delete or
        reinstate returns 409.
        No lockout state: no failed-attempt counter, only the per-IP
        rate limit (5 sign-in requests per minute, 429).</span></div></foreignObject></g></g><g class="label edgeLabel" id="Active---Active---1" transform="translate(964.28125, 759.5250000003725)"><rect width="0.1" height="0.1"/><g class="label" style="" transform="translate(0, 0)"><rect/><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;"><span class="nodeLabel"></span></div></foreignObject></g></g><g class="label edgeLabel" id="Active---Active---2" transform="translate(1371.7734375, 777.0500000007451)"><rect width="0.1" height="0.1"/><g class="label" style="" transform="translate(0, 0)"><rect/><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;"><span class="nodeLabel"></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><text text-anchor="middle" x="764.8046875" y="-25" class="statediagramTitleText">State diagram - user account (User.IsActive, User.EmailConfirmed)</text></svg>