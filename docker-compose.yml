version: '3.8'

services:
  smp-postgres:
    image: postgres:15-alpine
    container_name: smp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strategies_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/seed:/seed

volumes:
  pgdata:
